name: dronedream

x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_URL: "postgresql+psycopg://dronedream:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/dronedream"
  DATABASE_AUTO_CREATE: "false"
  REDIS_URL: redis://valkey:6379/0
  REQUIRE_WORKER_HEARTBEAT: "true"
  AUTH_MODE: demo_token
  DEMO_AUTH_TOKENS: "${DEMO_AUTH_TOKENS:?Set DEMO_AUTH_TOKENS in .env}"
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  ARTIFACT_STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: dronedream
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dronedream}
  S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
  S3_PREFIX: artifacts/
  ARTIFACT_ROOT: /srv/artifacts
  REAL_SIMULATOR_ARTIFACT_ROOT: /srv/artifacts
  APP_SECRET_KEY: "${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}"

# Only operator-facing simulator settings belong here. The runner creates its
# own PX4_TRIAL_* request/evidence paths and PX4_PARAMETER_* context variables;
# accepting those from Compose would let deployment configuration override
# per-trial isolation data.
x-simulator-environment: &simulator-environment
  SIMULATOR_BACKEND: "${SIMULATOR_BACKEND:-}"
  REAL_SIMULATOR_COMMAND: "${REAL_SIMULATOR_COMMAND:-}"
  REAL_SIMULATOR_WORKDIR: "${REAL_SIMULATOR_WORKDIR:-}"
  REAL_SIMULATOR_TIMEOUT_SECONDS: "${REAL_SIMULATOR_TIMEOUT_SECONDS:-300}"
  REAL_SIMULATOR_KEEP_RUN_DIRS: "${REAL_SIMULATOR_KEEP_RUN_DIRS:-true}"
  DRONEDREAM_PX4_EXECUTABLE: "${DRONEDREAM_PX4_EXECUTABLE:-}"
  DRONEDREAM_GAZEBO_EXECUTABLE: "${DRONEDREAM_GAZEBO_EXECUTABLE:-}"
  PX4_VERSION: "${PX4_VERSION:-main}"
  PX4_AUTOPILOT_DIR: "${PX4_AUTOPILOT_DIR:-}"
  PX4_FIRMWARE_COMMIT_OBSERVED: "${PX4_FIRMWARE_COMMIT_OBSERVED:-}"
  PX4_GAZEBO_LAUNCH_COMMAND: "${PX4_GAZEBO_LAUNCH_COMMAND:-}"
  PX4_GAZEBO_WORKDIR: "${PX4_GAZEBO_WORKDIR:-}"
  PX4_GAZEBO_TIMEOUT_SECONDS: "${PX4_GAZEBO_TIMEOUT_SECONDS:-300}"
  PX4_GAZEBO_HEADLESS: "${PX4_GAZEBO_HEADLESS:-true}"
  PX4_GAZEBO_KEEP_RAW_LOGS: "${PX4_GAZEBO_KEEP_RAW_LOGS:-true}"
  PX4_GAZEBO_DRY_RUN: "${PX4_GAZEBO_DRY_RUN:-false}"
  PX4_GAZEBO_PASS_RMSE: "${PX4_GAZEBO_PASS_RMSE:-0.75}"
  PX4_GAZEBO_PASS_MAX_ERROR: "${PX4_GAZEBO_PASS_MAX_ERROR:-2.0}"
  PX4_GAZEBO_MIN_TRACK_COVERAGE: "${PX4_GAZEBO_MIN_TRACK_COVERAGE:-0.9}"
  PX4_GAZEBO_EVAL_ALTITUDE_FRACTION: "${PX4_GAZEBO_EVAL_ALTITUDE_FRACTION:-0.9}"
  PX4_GAZEBO_EVAL_NEAR_TRACK_THRESHOLD_M: "${PX4_GAZEBO_EVAL_NEAR_TRACK_THRESHOLD_M:-1.5}"
  PX4_GAZEBO_EVAL_CONSECUTIVE_SAMPLES: "${PX4_GAZEBO_EVAL_CONSECUTIVE_SAMPLES:-5}"
  PX4_GAZEBO_EVAL_COLLAPSE_ALTITUDE_FRACTION: "${PX4_GAZEBO_EVAL_COLLAPSE_ALTITUDE_FRACTION:-0.5}"
  PX4_GAZEBO_VEHICLE: "${PX4_GAZEBO_VEHICLE:-}"
  PX4_GAZEBO_WORLD: "${PX4_GAZEBO_WORLD:-}"
  PX4_GAZEBO_EXTRA_ARGS: "${PX4_GAZEBO_EXTRA_ARGS:-}"
  PX4_GAZEBO_TELEMETRY_FORMAT: "${PX4_GAZEBO_TELEMETRY_FORMAT:-json}"
  PX4_GAZEBO_ALLOW_CSV_TELEMETRY: "${PX4_GAZEBO_ALLOW_CSV_TELEMETRY:-false}"
  PX4_GAZEBO_ALLOW_UNVERIFIED_ADVANCED_EFFECTS: "${PX4_GAZEBO_ALLOW_UNVERIFIED_ADVANCED_EFFECTS:-false}"
  PX4_SETUP_COMMANDS: "${PX4_SETUP_COMMANDS:-}"
  PX4_LAUNCH_COMMAND_TEMPLATE: "${PX4_LAUNCH_COMMAND_TEMPLATE:-}"
  PX4_MAKE_TARGET: "${PX4_MAKE_TARGET:-}"
  PX4_FORCE_MAKE_TARGET: "${PX4_FORCE_MAKE_TARGET:-false}"
  PX4_RUN_SECONDS: "${PX4_RUN_SECONDS:-30}"
  PX4_READY_TIMEOUT_SECONDS: "${PX4_READY_TIMEOUT_SECONDS:-30}"
  PX4_SITE_DRY_RUN: "${PX4_SITE_DRY_RUN:-false}"
  PX4_TELEMETRY_MODE: "${PX4_TELEMETRY_MODE:-json}"
  PX4_TELEMETRY_SOURCE_JSON: "${PX4_TELEMETRY_SOURCE_JSON:-}"
  PX4_ULOG_ROOT: "${PX4_ULOG_ROOT:-}"
  PX4_ULOG_PATH: "${PX4_ULOG_PATH:-}"
  PX4_ENABLE_OFFBOARD_EXECUTOR: "${PX4_ENABLE_OFFBOARD_EXECUTOR:-true}"
  PX4_OFFBOARD_EXECUTOR_COMMAND: "${PX4_OFFBOARD_EXECUTOR_COMMAND:-}"
  PX4_OFFBOARD_CONNECTION: "${PX4_OFFBOARD_CONNECTION:-udp://:14540}"
  PX4_OFFBOARD_SETPOINT_RATE_HZ: "${PX4_OFFBOARD_SETPOINT_RATE_HZ:-10}"
  PX4_OFFBOARD_TAKEOFF_TIMEOUT_SECONDS: "${PX4_OFFBOARD_TAKEOFF_TIMEOUT_SECONDS:-30}"
  PX4_OFFBOARD_TRACK_TIMEOUT_SECONDS: "${PX4_OFFBOARD_TRACK_TIMEOUT_SECONDS:-120}"
  PX4_OFFBOARD_PROCESS_TIMEOUT_SECONDS: "${PX4_OFFBOARD_PROCESS_TIMEOUT_SECONDS:-330}"
  PX4_OFFBOARD_LAND_AFTER: "${PX4_OFFBOARD_LAND_AFTER:-true}"
  PX4_OFFBOARD_DRY_RUN: "${PX4_OFFBOARD_DRY_RUN:-false}"
  PX4_PARAMETER_TRANSPORT: "${PX4_PARAMETER_TRANSPORT:-environment}"
  PX4_PARAMETER_CONNECTION: "${PX4_PARAMETER_CONNECTION:-udp://:14540}"
  PX4_PARAMETER_TIMEOUT_SECONDS: "${PX4_PARAMETER_TIMEOUT_SECONDS:-15}"
  PX4_PARAMETER_ENFORCE_SAFE_BOUNDS: "${PX4_PARAMETER_ENFORCE_SAFE_BOUNDS:-true}"
  PX4_GAZEBO_ENTITY_FACTORY_TIMEOUT_MS: "${PX4_GAZEBO_ENTITY_FACTORY_TIMEOUT_MS:-5000}"
  PX4_GAZEBO_LAUNCH_GUI_CLIENT: "${PX4_GAZEBO_LAUNCH_GUI_CLIENT:-false}"
  PX4_GAZEBO_GUI_COMMAND: "${PX4_GAZEBO_GUI_COMMAND:-}"
  PX4_GAZEBO_RAW_GUI_COMMAND: "${PX4_GAZEBO_RAW_GUI_COMMAND:-gz sim -g}"
  PX4_GAZEBO_GUI_START_DELAY_SECONDS: "${PX4_GAZEBO_GUI_START_DELAY_SECONDS:-5}"
  PX4_GAZEBO_GUI_WAIT_TIMEOUT_SECONDS: "${PX4_GAZEBO_GUI_WAIT_TIMEOUT_SECONDS:-15}"
  PX4_GAZEBO_REQUIRE_GUI_CLIENT: "${PX4_GAZEBO_REQUIRE_GUI_CLIENT:-false}"
  PX4_GAZEBO_DRAW_TRACK_MARKER: "${PX4_GAZEBO_DRAW_TRACK_MARKER:-false}"
  PX4_GAZEBO_TRACK_MARKER_COMMAND: "${PX4_GAZEBO_TRACK_MARKER_COMMAND:-}"
  PX4_GAZEBO_TRACK_MARKER_START_DELAY_SECONDS: "${PX4_GAZEBO_TRACK_MARKER_START_DELAY_SECONDS:-2}"
  PX4_GAZEBO_TRACK_MARKER_PROCESS_TIMEOUT_SECONDS: "${PX4_GAZEBO_TRACK_MARKER_PROCESS_TIMEOUT_SECONDS:-60}"
  PX4_GAZEBO_REQUIRE_TRACK_MARKER: "${PX4_GAZEBO_REQUIRE_TRACK_MARKER:-false}"
  PX4_GAZEBO_TRACK_MARKER_Z_OFFSET: "${PX4_GAZEBO_TRACK_MARKER_Z_OFFSET:-0.03}"
  PX4_GAZEBO_TRACK_MARKER_COLOR: "${PX4_GAZEBO_TRACK_MARKER_COLOR:-0 0.8 1 1}"
  PX4_GAZEBO_TRACK_MARKER_LINE_WIDTH: "${PX4_GAZEBO_TRACK_MARKER_LINE_WIDTH:-0.08}"
  PX4_GAZEBO_TRACK_MARKER_MODE: "${PX4_GAZEBO_TRACK_MARKER_MODE:-line_strip}"
  PX4_GAZEBO_MARKER_SERVICE: "${PX4_GAZEBO_MARKER_SERVICE:-}"
  DISPLAY: "${DISPLAY:-}"
  LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
  QT_X11_NO_MITSHM: "${QT_X11_NO_MITSHM:-1}"
  GEOMETRY: "${GEOMETRY:-1600x900x24}"
  PX4_GAZEBO_VNC_DESKTOP_GEOMETRY: "${PX4_GAZEBO_VNC_DESKTOP_GEOMETRY:-1600x900x24}"
  PX4_GAZEBO_GUI_WINDOW_TITLE: "${PX4_GAZEBO_GUI_WINDOW_TITLE:-Gazebo Sim}"
  PX4_GAZEBO_GUI_WINDOW_MODE: "${PX4_GAZEBO_GUI_WINDOW_MODE:-fill}"
  PX4_GAZEBO_GUI_WINDOW_GEOMETRY: "${PX4_GAZEBO_GUI_WINDOW_GEOMETRY:-fill}"
  PX4_GAZEBO_GUI_WINDOW_WIDTH: "${PX4_GAZEBO_GUI_WINDOW_WIDTH:-1280}"
  PX4_GAZEBO_GUI_WINDOW_HEIGHT: "${PX4_GAZEBO_GUI_WINDOW_HEIGHT:-720}"
  PX4_GAZEBO_GUI_WINDOW_DELAY_SECONDS: "${PX4_GAZEBO_GUI_WINDOW_DELAY_SECONDS:-8}"
  PX4_GAZEBO_GUI_WINDOW_RETRY_SECONDS: "${PX4_GAZEBO_GUI_WINDOW_RETRY_SECONDS:-20}"
  PX4_GAZEBO_GUI_WINDOW_ENFORCE_SECONDS: "${PX4_GAZEBO_GUI_WINDOW_ENFORCE_SECONDS:-30}"

services:
  postgres:
    image: postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
    environment:
      POSTGRES_DB: dronedream
      POSTGRES_USER: dronedream
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dronedream -d dronedream"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.8-alpine3.23@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dronedream}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/dronedream &&
        mc anonymous set none local/dronedream
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dronedream}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: api
    environment:
      <<: *backend-environment
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: worker
    environment:
      <<: [*backend-environment, *simulator-environment]
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-info}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-900}
      WORKER_LEASE_HEARTBEAT_SECONDS: ${WORKER_LEASE_HEARTBEAT_SECONDS:-30}
    depends_on:
      api:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_DEMO_AUTH_TOKEN: "${VITE_DEMO_AUTH_TOKEN:?Set VITE_DEMO_AUTH_TOKEN in .env}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  minio-data:
