name: Release Software
run-name: Release Software

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build as an unsigned validation artifact
        required: true
        type: choice
        default: universal
        options:
          - universal
          - sim
          - lab
          - field
          - autonomy
      test_signing:
        description: Submit the source-built installer to SignPath test-signing (never publish)
        required: false
        type: boolean
        default: false
      release_tag:
        description: Draft five-edition release to sign and publish; leave empty to build a validation installer
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-software-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  native-core:
    name: Pinned Core native components
    if: ${{ inputs.release_tag == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      repository: ${{ steps.core-inputs.outputs.repository }}
      commit: ${{ steps.core-inputs.outputs.commit }}
    steps:
      - name: Check out product build contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve complete pinned Core inputs
        id: core-inputs
        run: |
          python3 apps/desktop/scripts/prepare-core-build-inputs.py \
            --source-reference shared/contracts/agent-core-source.json \
            --inputs release/desktop/config/updates/core-build-inputs.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out exact public Core source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.core-inputs.outputs.repository }}
          ref: ${{ steps.core-inputs.outputs.commit }}
          path: artifacts/agent-core-source
          submodules: recursive
          persist-credentials: false

      - name: Check out exact PX4 magnetic-table source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.core-inputs.outputs.px4_repository }}
          ref: ${{ steps.core-inputs.outputs.px4_commit }}
          path: artifacts/px4-source
          persist-credentials: false

      - name: Install matching Gazebo native build dependencies
        env:
          GAZEBO_VERSION: ${{ steps.core-inputs.outputs.gazebo_version }}
          GAZEBO_KEY_SHA256: ${{ steps.core-inputs.outputs.gazebo_key_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://packages.osrfoundation.org/gazebo.gpg --output "$RUNNER_TEMP/gazebo.gpg"
          echo "$GAZEBO_KEY_SHA256  $RUNNER_TEMP/gazebo.gpg" | sha256sum --check --strict
          sudo install -m 0644 "$RUNNER_TEMP/gazebo.gpg" /usr/share/keyrings/gazebo-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/gazebo-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable noble main' \
            | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "gz-harmonic=$GAZEBO_VERSION" \
            build-essential cmake python3-venv cppzmq-dev

      - name: Build and test current native sensor components
        run: |
          set -euo pipefail
          python3 -m venv artifacts/agent-core-source/.venv
          artifacts/agent-core-source/.venv/bin/python -m pip install setuptools wheel -e ./artifacts/agent-core-source
          artifacts/agent-core-source/.venv/bin/python \
            artifacts/agent-core-source/scripts/build_native_sensor_runtime.py \
            --px4-root "$GITHUB_WORKSPACE/artifacts/px4-source" \
            --output "$GITHUB_WORKSPACE/artifacts/native-build"
          artifacts/agent-core-source/.venv/bin/python \
            artifacts/agent-core-source/scripts/stage_native_sensor_runtime.py \
            --source "$GITHUB_WORKSPACE/artifacts/native-build" \
            --output "$GITHUB_WORKSPACE/artifacts/native-runtime/native-sensors"
          artifacts/agent-core-source/.venv/bin/python \
            artifacts/agent-core-source/scripts/build_payload_placement_runtime.py \
            --output "$GITHUB_WORKSPACE/artifacts/payload-build"
          artifacts/agent-core-source/.venv/bin/python \
            artifacts/agent-core-source/scripts/build_payload_placement_runtime.py \
            --stage-from "$GITHUB_WORKSPACE/artifacts/payload-build" \
            --output "$GITHUB_WORKSPACE/artifacts/native-runtime/payload-placement"
          cmake -S artifacts/agent-core-source/native/camera_clock -B artifacts/camera-clock-build -DCMAKE_BUILD_TYPE=Release
          cmake --build artifacts/camera-clock-build -j 2
          artifacts/agent-core-source/.venv/bin/python \
            artifacts/agent-core-source/scripts/record_camera_clock_build.py --build artifacts/camera-clock-build
          artifacts/agent-core-source/.venv/bin/python \
            artifacts/agent-core-source/scripts/stage_native_camera_clock.py \
            --source artifacts/camera-clock-build --output artifacts/native-runtime/camera-clock
          SOURCE_DATE_EPOCH=946684800 artifacts/agent-core-source/.venv/bin/python -m pip wheel \
            --no-deps --no-build-isolation --wheel-dir artifacts/native-runtime/wheels ./artifacts/agent-core-source

      - name: Upload source-bound native Runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-core-native-runtime
          path: artifacts/native-runtime/*
          if-no-files-found: error
          retention-days: 3

  windows-nsis:
    name: Windows x64 NSIS
    if: ${{ inputs.release_tag == '' }}
    needs: native-core
    runs-on: windows-2022
    # Two SignPath requests require explicit release approval. Keep enough
    # headroom for review without turning a stalled request into an endless job.
    timeout-minutes: 180
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      edition_id: ${{ steps.release.outputs.edition_id }}
      product_name: ${{ steps.release.outputs.product_name }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      public_installer: ${{ steps.release.outputs.public_installer }}
      metadata_file: ${{ steps.release.outputs.metadata_file }}
      channel_tag: ${{ steps.release.outputs.channel_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      CARGO_BUILD_JOBS: "4"
      # These are public browser client identifiers, not service credentials.
      # Keep them in repository variables so CI exercises the same approved
      # account endpoint as formal desktop builds.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      DRONEDREAM_OAUTH_CLIENT_ID_AGENT: ${{ vars.DRONEDREAM_OAUTH_CLIENT_ID_AGENT || vars.DRONEDREAM_OAUTH_CLIENT_ID_AUTONOMY }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve edition release contract
        id: release
        shell: pwsh
        env:
          OAUTH_UNIVERSAL: ${{ vars.DRONEDREAM_OAUTH_CLIENT_ID_UNIVERSAL }}
          OAUTH_SIM: ${{ vars.DRONEDREAM_OAUTH_CLIENT_ID_SIM }}
          OAUTH_LAB: ${{ vars.DRONEDREAM_OAUTH_CLIENT_ID_LAB }}
          OAUTH_FIELD: ${{ vars.DRONEDREAM_OAUTH_CLIENT_ID_FIELD }}
          OAUTH_AUTONOMY: ${{ vars.DRONEDREAM_OAUTH_CLIENT_ID_AGENT || vars.DRONEDREAM_OAUTH_CLIENT_ID_AUTONOMY }}
        run: |
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            ""
          }
          if ($releaseTag) {
            git fetch --no-tags origin `
              "+refs/heads/main:refs/remotes/origin/main"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch the authoritative main branch for release verification."
            }
            git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Formal desktop release tags must point to a commit already merged into main."
            }
          }
          $contract = ./apps/desktop/scripts/resolve-desktop-edition-release.ps1 `
            -ReleaseTag $releaseTag `
            -ValidationEditionId "${{ inputs.edition || 'universal' }}" `
            -GitHubOutputPath $env:GITHUB_OUTPUT
          $oauthName = "OAUTH_$($contract.editionId.ToUpperInvariant())"
          $oauthClientId = [Environment]::GetEnvironmentVariable($oauthName)
          if (-not $contract.isRelease -and [string]::IsNullOrWhiteSpace($oauthClientId)) {
            # Validation artifacts cannot complete browser sign-in, but they
            # must still exercise the same edition-bound application build.
            $oauthClientId = "unregistered-$($contract.editionId)-validation-client"
          }
          if ($contract.isRelease -and $oauthClientId -notmatch `
            '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$') {
            throw "Formal releases require the registered public OAuth client ID for $($contract.editionId)."
          }
          @(
            "DRONEDREAM_DESKTOP_EDITION_ID=$($contract.editionId)",
            "DRONEDREAM_EDITION_PROFILE=$($contract.runtimeProfileId)",
            "DRONEDREAM_OAUTH_CLIENT_ID=$oauthClientId",
            "VITE_DRONEDREAM_EDITION=$($contract.editionId)"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($contract.isRelease) {
            @(
              "DRONEDREAM_RELEASE_SOURCE_COMMIT=$env:GITHUB_SHA",
              "DRONEDREAM_RELEASE_BUILD_NUMBER=$($contract.buildNumber)"
            ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Verify release version consistency
        id: release-version
        shell: pwsh
        run: |
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            ""
          }
          ./apps/desktop/scripts/verify-desktop-version.ps1 -ReleaseTag $releaseTag
          $desktopVersion = (
            Get-Content -LiteralPath "apps/desktop/src/tauri.conf.json" -Raw |
              ConvertFrom-Json
          ).version
          "version=$desktopVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $backendProjectVersionMatch = Select-String `
            -LiteralPath "server/api/pyproject.toml" `
            -Pattern '^version\s*=\s*"([^"]+)"\s*$' |
            Select-Object -First 1
          $backendCodeVersionMatch = Select-String `
            -LiteralPath "server/api/app/__init__.py" `
            -Pattern '^__version__\s*=\s*"([^"]+)"\s*$' |
            Select-Object -First 1
          if (-not $backendProjectVersionMatch -or -not $backendCodeVersionMatch) {
            throw "Backend package or code version was not found"
          }
          $backendProjectVersion = $backendProjectVersionMatch.Matches[0].Groups[1].Value
          $backendCodeVersion = $backendCodeVersionMatch.Matches[0].Groups[1].Value

          if ($backendProjectVersion -cne $backendCodeVersion) {
            throw "Backend versions disagree: pyproject=$backendProjectVersion code=$backendCodeVersion"
          }
          Write-Host "Backend versions verified: $backendCodeVersion"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Set up Rust 1.97.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # action snapshot, 2026-07-10
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Set up Core Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify desktop release workflow contract
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install "pytest==9.1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest release/desktop/tests/test_desktop_release_workflow_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify desktop browser-auth public configuration
        shell: pwsh
        run: node ./apps/desktop/scripts/verify-browser-auth-config.mjs

      - name: Install JavaScript dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --prefix apps/web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify updater build and signing contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix apps/desktop run verify:updater-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/desktop run verify:updater-signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify open-source release inventory
        shell: pwsh
        run: npm --prefix apps/desktop run verify:release-source

      - name: Verify pinned NSIS template
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-nsis-template.ps1
          ./apps/desktop/scripts/verify-installer-removal-wait.ps1

      - name: Validate SignPath release configuration
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_APPLICATION_POLICY_SLUG: ${{ vars.SIGNPATH_APPLICATION_POLICY_SLUG }}
          SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_POLICY_SLUG: ${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_APPLICATION_POLICY_SLUG",
            "SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG",
            "SIGNPATH_INSTALLER_POLICY_SLUG",
            "SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG"
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Formal releases require accepted SignPath configuration: $($missing -join ', ')"
          }

      - name: Generate edition installer icons
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install "Pillow==12.2.0"
          python tools/build-brand-assets.py --edition "${{ steps.release.outputs.edition_id }}"

      - name: Check out source-bound Core for Windows
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.native-core.outputs.repository }}
          ref: ${{ needs.native-core.outputs.commit }}
          path: artifacts/agent-core-source
          submodules: recursive
          persist-credentials: false

      - name: Download this run's native components
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: current-core-native-runtime
          path: artifacts/native-runtime

      - name: Download exact admitted model input
        shell: pwsh
        run: |
          $inputs = Get-Content release/desktop/config/updates/core-build-inputs.json -Raw | ConvertFrom-Json
          if ($null -ne $inputs.model_bundle) {
            python apps/desktop/scripts/prepare-core-build-inputs.py `
              --source-reference shared/contracts/agent-core-source.json `
              --inputs release/desktop/config/updates/core-build-inputs.json `
              --download-to artifacts/model-input
            if ($LASTEXITCODE -ne 0) { throw 'Pinned model input preparation failed' }
          }

      - name: Build complete Core components from source
        shell: pwsh
        run: |
          python -m venv artifacts/agent-core-source/.venv
          if ($LASTEXITCODE -ne 0) { throw 'Core Python environment creation failed' }
          $policy = @{}
          if (Test-Path artifacts/model-input/package/manifest.json) {
            $policy.LocalPolicyPackage = Join-Path $env:GITHUB_WORKSPACE 'artifacts/model-input/package'
            $policy.LocalPolicySimulationAdmission = Join-Path $env:GITHUB_WORKSPACE 'artifacts/model-input/simulation-admission.json'
            $policy.LocalPolicyDistributionLicenses = Join-Path $env:GITHUB_WORKSPACE 'artifacts/model-input/licenses.json'
          }
          $wheels = @(Get-ChildItem artifacts/native-runtime/wheels -Filter '*.whl' -File)
          if ($wheels.Count -ne 1) { throw 'Expected one source-built Linux Core wheel from this run' }
          ./artifacts/agent-core-source/scripts/build-autonomy-windows.ps1 `
            -StageOnly @policy `
            -RuntimeCoreWheel $wheels[0].FullName `
            -NativeSensorRuntime (Join-Path $env:GITHUB_WORKSPACE 'artifacts/native-runtime/native-sensors') `
            -PayloadPlacementRuntime (Join-Path $env:GITHUB_WORKSPACE 'artifacts/native-runtime/payload-placement') `
            -CameraClockRuntime (Join-Path $env:GITHUB_WORKSPACE 'artifacts/native-runtime/camera-clock')

      - name: Stage verified Core into product
        shell: pwsh
        run: |
          ./apps/desktop/scripts/stage-agent-core.ps1 `
            -AgentCoreRepository (Join-Path $env:GITHUB_WORKSPACE 'artifacts/agent-core-source')

      - name: Install backend test dependencies
        # Pull requests are already gated by the repository quality workflow.
        # Keep the duplicated full backend suite only for immutable release tags,
        # where this workflow must remain independently reproducible.
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -e "./server/api[dev]" `
            "ruff==0.15.21" "mypy==2.2.0" "pytest==9.1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify backend
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        working-directory: server/api
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m ruff check app tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify shared frontend
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix apps/web run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/web run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Windows hosted runner is materially slower than local jsdom.
          # Keep assertions unchanged while allowing the existing wizard tests
          # enough time to finish under runner load.
          npm --prefix apps/web run test -- --testTimeout 15000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify desktop Rust
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --manifest-path apps/desktop/src/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --release --locked --manifest-path apps/desktop/src/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Release-profile tests reuse most compiled artifacts in the NSIS build.
          cargo test --release --locked --manifest-path apps/desktop/src/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build DroneDream application or unsigned test installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseBuild = "${{ steps.release.outputs.is_release }}" -ceq "true"
          # `npm --prefix apps/desktop` executes Tauri with `desktop` as its working
          # directory, while the resolver deliberately emits repository-root
          # paths for the later release-inventory checks.
          $configPath = "${{ steps.release.outputs.config_path }}" -replace '^apps/desktop/', ''
          $buildExitCode = 1
          foreach ($attempt in 1..3) {
            if ($releaseBuild) {
              # Sign the application before NSIS embeds it. Tauri's separate
              # bundle command below packages these already signed bytes.
              npm --prefix apps/desktop run build -- --config $configPath --no-bundle
            } else {
              # Pull requests exercise a real edition installer without
              # obtaining or publishing either release signature.
              npm --prefix apps/desktop run build -- `
                --config $configPath `
                --config '{"bundle":{"createUpdaterArtifacts":false}}'
            }
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -eq 0) { break }
            if ($attempt -lt 3) {
              Write-Warning "Desktop build attempt $attempt failed with exit code $buildExitCode; retrying in 10 seconds"
              Start-Sleep -Seconds 10
            }
          }
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Upload unsigned application for SignPath
        if: ${{ steps.release.outputs.is_release == 'true' }}
        id: upload-unsigned-application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DroneDream-unsigned-application
          archive: false
          if-no-files-found: error
          retention-days: 1
          path: apps/desktop/src/target/release/drone-dream-desktop.exe

      - name: Submit application signing request
        if: ${{ steps.release.outputs.is_release == 'true' }}
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_APPLICATION_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APPLICATION_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-application.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: apps/desktop/src/target/release/signpath/application
          skip-decompress: true

      - name: Install and verify signed application
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        run: |
          $target = "apps/desktop/src/target/release/drone-dream-desktop.exe"
          $signed = @(
            Get-ChildItem `
              -LiteralPath "apps/desktop/src/target/release/signpath/application" `
              -Recurse -Filter "drone-dream-desktop.exe" -File
          )
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed application from SignPath, found $($signed.Count)."
          }
          Copy-Item -LiteralPath $signed[0].FullName -Destination $target -Force
          $signature = Get-AuthenticodeSignature -LiteralPath $target
          if ($signature.Status -ne "Valid") {
            throw "Signed application failed Authenticode verification: $($signature.StatusMessage)"
          }

      - name: Bundle the signed application as NSIS
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $bundleExitCode = 1
          foreach ($attempt in 1..3) {
            npm --prefix apps/desktop run tauri -- bundle `
              --config ("${{ steps.release.outputs.config_path }}" -replace '^apps/desktop/', '') `
              --bundles nsis
            $bundleExitCode = $LASTEXITCODE
            if ($bundleExitCode -eq 0) { break }
            if ($attempt -lt 3) {
              Write-Warning "NSIS bundle attempt $attempt failed with exit code $bundleExitCode; retrying in 10 seconds"
              Start-Sleep -Seconds 10
            }
          }
          if ($bundleExitCode -ne 0) { exit $bundleExitCode }

      - name: Verify WebView2 installer health gate
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-webview2-installer.ps1 `
            -GeneratedNsi "apps/desktop/src/target/release/nsis/x64/installer.nsi"

      - name: Verify installer locales and extracted planner
        shell: pwsh
        run: |
          ./apps/desktop/scripts/verify-installer-path-guard.ps1
          ./apps/desktop/scripts/verify-installer-locales.ps1 `
            -GeneratedNsi "apps/desktop/src/target/release/nsis/x64/installer.nsi"
          ./apps/desktop/scripts/verify-installer-planner.ps1 `
            -Application "apps/desktop/src/target/release/drone-dream-desktop.exe" `
            -EditionId "${{ steps.release.outputs.edition_id }}"

      - name: Upload unsigned installer for SignPath
        if: ${{ steps.release.outputs.is_release == 'true' }}
        id: upload-unsigned-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DroneDream-unsigned-installer
          archive: false
          if-no-files-found: error
          retention-days: 1
          path: apps/desktop/src/target/release/bundle/nsis/${{ steps.release.outputs.bundle_installer }}

      - name: Submit installer signing request
        if: ${{ steps.release.outputs.is_release == 'true' }}
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: apps/desktop/src/target/release/signpath/installer
          skip-decompress: true

      - name: Install and verify signed installer
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src/target/release/bundle/nsis"
          $target = Join-Path `
            $bundleDir `
            "${{ steps.release.outputs.bundle_installer }}"
          $signed = @(
            Get-ChildItem `
              -LiteralPath "apps/desktop/src/target/release/signpath/installer" `
              -Recurse -Filter "${{ steps.release.outputs.bundle_installer }}" -File
          )
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed installer from SignPath, found $($signed.Count)."
          }
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
            throw "Unsigned installer target was not found at $target"
          }
          Copy-Item -LiteralPath $signed[0].FullName -Destination $target -Force
          $signature = Get-AuthenticodeSignature -LiteralPath $target
          if ($signature.Status -ne "Valid") {
            throw "Signed installer failed Authenticode verification: $($signature.StatusMessage)"
          }

      - name: Write release inventory and SHA-256 checksum
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src/target/release/bundle/nsis"
          $installer = Get-Item -LiteralPath (
            Join-Path $bundleDir "${{ steps.release.outputs.bundle_installer }}"
          )
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          $checksumPath = "$($installer.FullName).sha256"
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" |
            Set-Content -Encoding ascii -LiteralPath $checksumPath
          npm --prefix apps/desktop run verify:release-source -- `
            --output "$bundleDir/release-source-inventory.json" `
            --edition-config "${{ steps.release.outputs.config_path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify publisher signatures and write updater manifest
        if: ${{ steps.release.outputs.is_release == 'true' }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundleDir = "apps/desktop/src/target/release/bundle/nsis"
          $installer = Get-Item -LiteralPath (
            Join-Path $bundleDir "${{ steps.release.outputs.bundle_installer }}"
          )
          if (-not $installer) { throw "The signed installer was not produced." }
          $application = "apps/desktop/src/target/release/drone-dream-desktop.exe"
          foreach ($signedFile in @($application, $installer.FullName)) {
            $authenticode = Get-AuthenticodeSignature -LiteralPath $signedFile
            if ($authenticode.Status -ne "Valid") {
              throw "Authenticode verification failed for ${signedFile}: $($authenticode.StatusMessage)"
            }
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "A formal desktop tag requires TAURI_SIGNING_PRIVATE_KEY."
          }
          $updaterKeyPath = Join-Path $env:RUNNER_TEMP "dronedream-updater.key"
          try {
            [IO.File]::WriteAllText(
              $updaterKeyPath,
              $env:TAURI_SIGNING_PRIVATE_KEY,
              (New-Object Text.UTF8Encoding($false))
            )
            ./apps/desktop/scripts/invoke-tauri-updater-signer.ps1 `
              -NodeExecutable ((Get-Command node.exe).Source) `
              -TauriCliPath (Resolve-Path `
                "./apps/desktop/node_modules/@tauri-apps/cli/tauri.js") `
              -UpdaterKeyPath $updaterKeyPath `
              -InstallerPath $installer.FullName
          } finally {
            Remove-Item -LiteralPath $updaterKeyPath -Force -ErrorAction SilentlyContinue
          }
          ./apps/desktop/scripts/write-updater-manifest.ps1 `
            -BundleDirectory $bundleDir `
            -EditionId "${{ steps.release.outputs.edition_id }}" `
            -BuildNumber ([UInt64]"${{ steps.release.outputs.build_number }}") `
            -SourceCommit $env:GITHUB_SHA

      - name: Verify installer lifecycle and checksum
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class DroneDreamSmokeNative
          {
              [DllImport("kernel32.dll")]
              public static extern uint SetErrorMode(uint mode);

              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              public static extern int GetClassName(
                  IntPtr window,
                  StringBuilder className,
                  int maximumCount
              );

              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr SendMessageTimeout(
                  IntPtr window,
                  uint message,
                  UIntPtr wParam,
                  IntPtr lParam,
                  uint flags,
                  uint timeout,
                  out UIntPtr result
              );
          }
          '@
          # Child processes inherit this mode. Loader failures therefore exit
          # instead of leaving a modal Windows error dialog that looks alive.
          [void][DroneDreamSmokeNative]::SetErrorMode(0x8003)

          $bundleDir = "apps/desktop/src/target/release/bundle/nsis"
          $installer = Get-Item -LiteralPath (
            Join-Path $bundleDir "${{ steps.release.outputs.bundle_installer }}"
          )
          $checksumPath = "$($installer.FullName).sha256"
          $checksumLine = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $checksumMatch = [regex]::Match(
            $checksumLine,
            '^([0-9a-f]{64})  ([^\\/]+)$',
            [System.Text.RegularExpressions.RegexOptions]::CultureInvariant
          )
          if (-not $checksumMatch.Success) {
            throw "Installer checksum has an invalid format"
          }
          if ($checksumMatch.Groups[2].Value -cne $installer.Name) {
            throw "Installer checksum names a different file"
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          if ($checksumMatch.Groups[1].Value -cne $actualHash.ToLowerInvariant()) {
            throw "Installer checksum verification failed"
          }

          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          $installDir = Join-Path $runnerTemp ("DroneDream-Smoke-" + [guid]::NewGuid().ToString("N"))
          $installDirFull = [System.IO.Path]::GetFullPath($installDir)
          $runnerTempPrefix = $runnerTemp + [System.IO.Path]::DirectorySeparatorChar
          if (-not $installDirFull.StartsWith(
            $runnerTempPrefix,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Refusing to test outside RUNNER_TEMP: $installDirFull"
          }

          $appProcess = $null
          $uninstaller = Join-Path $installDirFull "uninstall.exe"
          # Ordinary desktop uninstall must preserve app-owned diagnostic state.
          # The interactive "delete app data" checkbox is the only operation
          # allowed to remove this bundle-owned directory. Runtime diagnostics
          # live in the separately marker-owned download cache and are even
          # further outside the uninstaller's ownership boundary.
          $appDataRoot = Join-Path `
            $env:LOCALAPPDATA `
            "io.dronedream.desktop.${{ steps.release.outputs.edition_id }}"
          $diagnosticRoot = Join-Path $appDataRoot "diagnostics"
          $diagnosticSentinel = Join-Path $diagnosticRoot "ci-uninstall-preserve.txt"
          New-Item -ItemType Directory -Force -Path $diagnosticRoot | Out-Null
          Set-Content -LiteralPath $diagnosticSentinel -Encoding utf8 -Value "preserve"
          try {
            $installProcess = Start-Process -FilePath $installer.FullName `
              -ArgumentList @("/S", "/D=$installDirFull") -Wait -PassThru
            if ($installProcess.ExitCode -ne 0) {
              throw "Silent installer failed with exit code $($installProcess.ExitCode)"
            }

            $application = Join-Path $installDirFull "drone-dream-desktop.exe"
            if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
              throw "Installed application was not found at $application"
            }
            if ("${{ steps.release.outputs.is_release }}" -ceq "true") {
              $installedSignature = Get-AuthenticodeSignature -LiteralPath $application
              if ($installedSignature.Status -ne "Valid") {
                throw "Installed application failed Authenticode verification: $($installedSignature.StatusMessage)"
              }
            }
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
              throw "NSIS uninstaller was not found at $uninstaller"
            }
            $licenseRoot = Join-Path $installDirFull "licenses"
            foreach ($licenseName in @(
              "DroneDream-LICENSE.txt",
              "THIRD_PARTY_NOTICES.md",
              "Valkey-COPYING.txt"
            )) {
              $licensePath = Join-Path $licenseRoot $licenseName
              if (-not (Test-Path -LiteralPath $licensePath -PathType Leaf)) {
                throw "Installed license material was not found at $licensePath"
              }
              if ((Get-Item -LiteralPath $licensePath).Length -le 0) {
                throw "Installed license material is empty: $licensePath"
              }
            }

            $originalPath = $env:PATH
            try {
              $env:PATH = @(
                (Join-Path $env:SystemRoot "System32"),
                $env:SystemRoot,
                (Join-Path $env:SystemRoot "System32\Wbem")
              ) -join ";"
              $appProcess = Start-Process -FilePath $application `
                -WorkingDirectory $installDirFull -PassThru
            }
            finally {
              $env:PATH = $originalPath
            }
            $launchDeadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "Installed application exited during the launch smoke test with code $($appProcess.ExitCode)"
              }
            } until (
              $appProcess.MainWindowTitle -ceq "${{ steps.release.outputs.window_title }}" -or
              [DateTime]::UtcNow -ge $launchDeadline
            )
            if ($appProcess.MainWindowTitle -cne "${{ steps.release.outputs.window_title }}") {
              throw "Installed application did not open its DroneDream window; observed title: '$($appProcess.MainWindowTitle)'"
            }

            $windowClass = [System.Text.StringBuilder]::new(256)
            if ([DroneDreamSmokeNative]::GetClassName(
              $appProcess.MainWindowHandle,
              $windowClass,
              $windowClass.Capacity
            ) -le 0) {
              throw "Could not inspect the installed application's main window"
            }
            if ($windowClass.ToString() -ceq "#32770") {
              throw "The installed application opened an error dialog instead of its main window"
            }
            $messageResult = [UIntPtr]::Zero
            $sendResult = [DroneDreamSmokeNative]::SendMessageTimeout(
              $appProcess.MainWindowHandle,
              0,
              [UIntPtr]::Zero,
              [IntPtr]::Zero,
              0x0002,
              2000,
              [ref]$messageResult
            )
            if ($sendResult -eq [IntPtr]::Zero) {
              throw "The installed application's main window is not responding"
            }
            Start-Sleep -Seconds 2
            $appProcess.Refresh()
            if ($appProcess.HasExited) {
              throw "Installed application exited immediately after opening with code $($appProcess.ExitCode)"
            }
          }
          finally {
            if ($null -ne $appProcess) {
              if (-not $appProcess.HasExited) {
                Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
              }
              if (-not $appProcess.WaitForExit(10000)) {
                throw "Installed application did not stop before uninstall"
              }
            }
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstallProcess = Start-Process -FilePath $uninstaller `
                -ArgumentList "/S" -Wait -PassThru
              if ($uninstallProcess.ExitCode -ne 0) {
                throw "Silent uninstaller failed with exit code $($uninstallProcess.ExitCode)"
              }
            }
          }
          ./apps/desktop/scripts/wait-path-removal.ps1 `
            -LiteralPath $installDirFull `
            -TimeoutSeconds 30 `
            -PollIntervalMilliseconds 250
          if (-not (Test-Path -LiteralPath $diagnosticSentinel -PathType Leaf)) {
            throw "Ordinary uninstall erased app diagnostic state without explicit consent"
          }

          # WebView2 may keep its BrowserMetrics file open briefly after the
          # Tauri parent exits. Stop only WebView2 children that reference this
          # app-owned profile, then retry the runner-only cleanup. The lifecycle
          # assertions above remain strict; an ephemeral metrics-file lock must
          # not turn a successful install/uninstall validation into a product
          # failure.
          $appDataToken = Split-Path -Leaf $appDataRoot
          @(
            Get-CimInstance Win32_Process `
              -Filter "Name = 'msedgewebview2.exe'" `
              -ErrorAction SilentlyContinue
          ) |
            Where-Object {
              $_.CommandLine -and $_.CommandLine.Contains(
                $appDataToken,
                [System.StringComparison]::OrdinalIgnoreCase
              )
            } |
            ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }

          $cleanupError = $null
          foreach ($cleanupAttempt in 1..6) {
            try {
              if (Test-Path -LiteralPath $appDataRoot) {
                Remove-Item -LiteralPath $appDataRoot -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $appDataRoot) {
                throw "The application data directory still exists"
              }
              $cleanupError = $null
              break
            }
            catch {
              $cleanupError = $_.Exception.Message
              if ($cleanupAttempt -lt 6) {
                Start-Sleep -Milliseconds (500 * $cleanupAttempt)
              }
            }
          }
          if (Test-Path -LiteralPath $appDataRoot) {
            Write-Warning (
              "Runner cleanup left a locked WebView2 metrics file after " +
              "six attempts; lifecycle assertions passed. Last error: $cleanupError"
            )
          }

      - name: Prepare edition release artifact
        shell: pwsh
        run: |
          $sourceDir = "apps/desktop/src/target/release/bundle/nsis"
          $distDir = "apps/desktop/release-dist"
          if (Test-Path -LiteralPath $distDir) {
            Remove-Item -LiteralPath $distDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $distDir | Out-Null

          $bundleInstaller = Join-Path `
            $sourceDir `
            "${{ steps.release.outputs.bundle_installer }}"
          $publicInstaller = Join-Path `
            $distDir `
            "${{ steps.release.outputs.public_installer }}"
          Copy-Item -LiteralPath $bundleInstaller -Destination $publicInstaller
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $publicInstaller
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($publicInstaller))" |
            Set-Content -Encoding ascii -LiteralPath "$publicInstaller.sha256"
          Copy-Item `
            -LiteralPath (Join-Path $sourceDir "release-source-inventory.json") `
            -Destination (Join-Path $distDir "release-source-inventory.json")

          if ("${{ steps.release.outputs.is_release }}" -ceq "true") {
            Copy-Item `
              -LiteralPath "$bundleInstaller.sig" `
              -Destination "$publicInstaller.sig"
            Copy-Item `
              -LiteralPath (Join-Path $sourceDir "${{ steps.release.outputs.metadata_file }}") `
              -Destination (Join-Path $distDir "${{ steps.release.outputs.metadata_file }}")
            $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
            if ($LASTEXITCODE -ne 0 -or $sourceTree -cnotmatch '^[0-9a-f]{40}$') {
              throw "Unable to bind the release receipt to the source tree."
            }
            $receipt = [ordered]@{
              schemaVersion = 1
              kind = "dronedream-five-edition-build-receipt"
              editionId = "${{ steps.release.outputs.edition_id }}"
              productName = "${{ steps.release.outputs.product_name }}"
              version = "${{ steps.release.outputs.version }}"
              buildNumber = [UInt64]"${{ steps.release.outputs.build_number }}"
              sourceCommit = $env:GITHUB_SHA
              sourceTree = $sourceTree
              compilerFamily = "msvc"
              targetTriple = "x86_64-pc-windows-msvc"
              installer = [ordered]@{
                fileName = [IO.Path]::GetFileName($publicInstaller)
                bytes = (Get-Item -LiteralPath $publicInstaller).Length
                sha256 = $hash.Hash.ToLowerInvariant()
                authenticodeVerified = $true
                updaterSignature = $true
              }
              releaseTag = "${{ steps.release.outputs.release_tag }}"
            }
            $utf8WithoutBom = New-Object Text.UTF8Encoding($false)
            [IO.File]::WriteAllText(
              "$publicInstaller.receipt.json",
              "$(($receipt | ConvertTo-Json -Depth 8))$([Environment]::NewLine)",
              $utf8WithoutBom
            )
            $releaseFiles = @(Get-ChildItem -LiteralPath $distDir -File)
            if ($releaseFiles.Count -ne 6) {
              throw "A formal edition release must contain exactly six files."
            }
          } else {
            $validationFiles = @(Get-ChildItem -LiteralPath $distDir -File)
            if ($validationFiles.Count -ne 3) {
              throw "A validation artifact must contain exactly three files."
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DroneDream-${{ steps.release.outputs.edition_id }}-Windows-x64
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || (github.event_name == 'workflow_dispatch' && 14 || 30) }}
          compression-level: 0
          path: apps/desktop/release-dist/*

      - name: Upload source-built installer for test signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_signing }}
        id: upload-test-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DroneDream-test-signing-installer
          archive: false
          if-no-files-found: error
          retention-days: 3
          path: apps/desktop/release-dist/${{ steps.release.outputs.public_installer }}

      - name: Submit source-built installer to SignPath test-signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_signing }}
        id: test-signing
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: test-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-test-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: artifacts/signpath-test

      - name: Upload test-signed installer (not a release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DroneDream-test-signed-installer
          path: artifacts/signpath-test/*
          if-no-files-found: error
          retention-days: 3

  publish-software:
    name: Publish five synchronized editions
    if: ${{ inputs.release_tag != '' }}
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^five-edition-v1\.0\.0-build-[1-9][0-9]*$') {
            throw "The handoff tag does not match the five-edition release contract."
          }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install updater signer
        shell: pwsh
        run: npm ci --prefix apps/desktop --ignore-scripts

      - name: Download and validate unsigned handoff
        id: handoff
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "five-edition-handoff"
          New-Item -ItemType Directory -Path $root | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $root
          if ($LASTEXITCODE -ne 0) { throw "The draft handoff could not be downloaded." }

          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --json isDraft,targetCommitish,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "The handoff release must remain a draft while signing." }
          if (@($release.assets).Count -ne 15) {
            throw "The unsigned handoff must contain exactly 15 assets."
          }

          $expectedEditions = @("universal", "sim", "lab", "field", "autonomy")
          $productNames = @{
            universal = "DroneDream-Universal"
            sim = "DroneDream-Sim"
            lab = "DroneDream-Lab"
            field = "DroneDream-Field"
            autonomy = "DroneDream-Agent"
          }
          $sourceCommit = $null
          $buildNumber = $null
          foreach ($edition in $expectedEditions) {
            $product = $productNames[$edition]
            $installer = Join-Path $root "${product}_1.0.0_x64-setup.exe"
            $checksum = "${installer}.sha256"
            $receiptPath = "${installer}.receipt.json"
            foreach ($path in @($installer, $checksum, $receiptPath)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Missing unsigned handoff asset: $path"
              }
            }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLine = (Get-Content -LiteralPath $checksum -Raw -Encoding ASCII).Trim()
            if ([string]$receipt.kind -cne "dronedream-five-edition-build-receipt" -or
                [string]$receipt.editionId -cne $edition -or
                [string]$receipt.installer.fileName -cne [IO.Path]::GetFileName($installer) -or
                [string]$receipt.installer.sha256 -cne $hash -or
                [Int64]$receipt.installer.bytes -ne (Get-Item -LiteralPath $installer).Length -or
                $checksumLine -cnotmatch "^${hash}\s+") {
              throw "The $edition handoff receipt or checksum is invalid."
            }
            if ($null -eq $sourceCommit) {
              $sourceCommit = [string]$receipt.sourceCommit
              $buildNumber = [UInt64]$receipt.buildNumber
            } elseif ([string]$receipt.sourceCommit -cne $sourceCommit -or
                      [UInt64]$receipt.buildNumber -ne $buildNumber) {
              throw "All five handoffs must share one source commit and build number."
            }
          }
          if ($env:RELEASE_TAG -cne "five-edition-v1.0.0-build-${buildNumber}") {
            throw "The release tag does not match build $buildNumber."
          }
          if ([string]$release.targetCommitish -cne $sourceCommit) {
            throw "The draft release target does not match source commit $sourceCommit."
          }
          "root=$root" >> $env:GITHUB_OUTPUT

      - name: Sign all five installers and update receipts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HANDOFF_ROOT: ${{ steps.handoff.outputs.root }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "dronedream-updater.key"
          $products = @(
            "DroneDream-Universal",
            "DroneDream-Sim",
            "DroneDream-Lab",
            "DroneDream-Field",
            "DroneDream-Agent"
          )
          try {
            [IO.File]::WriteAllText(
              $keyPath,
              $env:TAURI_SIGNING_PRIVATE_KEY,
              (New-Object Text.UTF8Encoding($false))
            )
            # The current Tauri CLI also consumes TAURI_SIGNING_PRIVATE_KEY
            # automatically. This workflow deliberately supplies the same key
            # through a temporary file, so remove the duplicate child-process
            # input before invoking the shared signer helper.
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY
            foreach ($product in $products) {
              $installer = Join-Path $env:HANDOFF_ROOT "${product}_1.0.0_x64-setup.exe"
              ./apps/desktop/scripts/invoke-tauri-updater-signer.ps1 `
                -NodeExecutable ((Get-Command node.exe).Source) `
                -TauriCliPath (Resolve-Path "./apps/desktop/node_modules/@tauri-apps/cli/tauri.js") `
                -UpdaterKeyPath $keyPath `
                -InstallerPath $installer
              $receiptPath = "${installer}.receipt.json"
              $receipt = Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
              $receipt.installer.updaterSignature = $true
              $receipt | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $receiptPath -Encoding UTF8
              gh release upload $env:RELEASE_TAG "${installer}.sig" $receiptPath `
                --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload signed assets for $product." }
            }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signed draft inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Signing must not publish the draft release." }
          $names = @($release.assets | ForEach-Object { [string]$_.name })
          if ($names.Count -ne 20 -or @($names | Sort-Object -Unique).Count -ne 20) {
            throw "The signed draft must contain exactly 20 unique assets."
          }
          foreach ($product in @("Universal", "Sim", "Lab", "Field", "Agent")) {
            $base = "DroneDream-${product}_1.0.0_x64-setup.exe"
            foreach ($suffix in @("", ".sig", ".sha256", ".receipt.json")) {
              if ($names -cnotcontains "${base}${suffix}") {
                throw "The signed draft is missing ${base}${suffix}."
              }
            }
          }


      - name: Prepare synchronized handoff
        id: synchronized-handoff
        shell: pwsh
        env:
          SIGNED_ROOT: ${{ steps.handoff.outputs.root }}
        run: |
          $handoff = Join-Path $env:RUNNER_TEMP "synchronized-software-release"
          New-Item -ItemType Directory -Path $handoff | Out-Null
          $products = [ordered]@{
            universal = "DroneDream-Universal"
            sim = "DroneDream-Sim"
            lab = "DroneDream-Lab"
            field = "DroneDream-Field"
            autonomy = "DroneDream-Agent"
          }
          foreach ($entry in $products.GetEnumerator()) {
            $editionRoot = Join-Path $handoff $entry.Key
            New-Item -ItemType Directory -Path $editionRoot | Out-Null
            $installerName = "$($entry.Value)_1.0.0_x64-setup.exe"
            $installer = Join-Path $env:SIGNED_ROOT $installerName
            Copy-Item -LiteralPath $installer -Destination (Join-Path $editionRoot $installerName)
            Copy-Item -LiteralPath "$installer.sig" -Destination (Join-Path $editionRoot "$installerName.sig")
            Copy-Item -LiteralPath "$installer.sha256" -Destination (Join-Path $editionRoot "$installerName.sha256")
            Copy-Item -LiteralPath "$installer.receipt.json" -Destination (Join-Path $editionRoot "build-receipt.json")
          }
          "root=$handoff" >> $env:GITHUB_OUTPUT

      - name: Publish software and updater channels
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./apps/desktop/scripts/publish-five-edition-release.ps1 `
            -HandoffRoot "${{ steps.synchronized-handoff.outputs.root }}" `
            -PublishOnly `
            -Confirm:$false
      - name: Preserve synchronized handoff for final verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synchronized-software-release
          path: ${{ steps.synchronized-handoff.outputs.root }}
          if-no-files-found: error
          retention-days: 7

  deploy-release-website:
    name: Deploy release website
    needs: publish-software
    permissions:
      contents: read
      deployments: write
      id-token: write
      pages: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit

  finish-software-release:
    name: Verify and finish release
    needs: deploy-release-website
    permissions:
      actions: read
      contents: write
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download synchronized handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: synchronized-software-release
          path: synchronized-software-release

      - name: Verify website and finish retention
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $response = Invoke-WebRequest -Uri "https://getdronedream.com/" -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "The public website did not return HTTP 200."
          }
          ./apps/desktop/scripts/publish-five-edition-release.ps1 `
            -HandoffRoot "synchronized-software-release" `
            -PruneObsoleteReleases `
            -Confirm:$false
