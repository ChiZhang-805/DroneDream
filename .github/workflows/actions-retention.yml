name: Actions retention

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Desktop installer
      - Deploy global product website
      - Quality gate
      - Runtime contract
      - Runtime release
      - Sign five-edition handoff
    types: [completed]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify retention rules
        run: python3 -m unittest discover -s release/distribution/tests -p test_installer_run_retention.py
      - name: Remove superseded completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 apps/desktop/scripts/prune-installer-runs.py --repository "$GITHUB_REPOSITORY" --apply
