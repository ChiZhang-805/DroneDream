name: Runtime contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate pinned inputs and Python code
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement platform/runtime/locks/release-tools-requirements.lock \
            "ruff==0.15.21" "pytest==9.1.1"
          python -m ruff check platform/runtime/tools platform/runtime/tests platform/runtime/scripts tools/simulators
          python -m ruff check platform/runtime/tools platform/runtime/scripts tools/simulators --select S
          python -m ruff format --check platform/runtime/tools platform/runtime/tests platform/runtime/scripts \
            tools/simulators
          python platform/runtime/tools/runtime_manifest.py validate-config \
            --pins platform/runtime/pins.env \
            --python-lock platform/runtime/locks/python-requirements.lock
          python -m compileall -q platform/runtime/tools platform/runtime/tests platform/runtime/scripts tools/simulators
          python -m pytest platform/runtime/tests -q
      - name: Validate shell syntax
        run: |
          mapfile -d '' scripts < <(find runtime tools/simulators -type f -name '*.sh' -print0)
          if (( ${#scripts[@]} == 0 )); then
            echo "No Runtime or simulator shell scripts were found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Checking ${script}"
            bash -n "${script}"
          done
      - name: Prove untested manifests cannot be released
        run: |
          python platform/runtime/tools/runtime_manifest.py generate \
            --pins platform/runtime/pins.env \
            --python-lock platform/runtime/locks/python-requirements.lock \
            --source-commit "$(git rev-parse HEAD)" \
            --output /tmp/runtime-manifest.json
          if python platform/runtime/tools/runtime_manifest.py validate \
            --manifest /tmp/runtime-manifest.json --require-smoke-passed; then
            echo "un-smoked manifest was incorrectly accepted" >&2
            exit 1
          fi
