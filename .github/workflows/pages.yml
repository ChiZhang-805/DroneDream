name: Deploy website
run-name: Deploy website

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build global website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify Pages deployment retention
        run: node --test apps/website/scripts/prune-github-pages-deployments.test.mjs

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Build the version-pinned Pages site
        shell: pwsh
        env:
          DRONEDREAM_CUSTOM_DOMAIN: ${{ vars.DRONEDREAM_CUSTOM_DOMAIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED }}
          VITE_AUTH_GITHUB_ENABLED: ${{ vars.VITE_AUTH_GITHUB_ENABLED }}
          VITE_AUTH_SLACK_ENABLED: ${{ vars.VITE_AUTH_SLACK_ENABLED }}
        run: ./apps/website/scripts/build-pages-site.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/web/site-dist

  deploy:
    name: Publish global website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  cleanup:
    name: Retain website and Actions history
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      deployments: write
    steps:
      - name: Check out retention policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ needs.deploy.result == 'success' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Delete inactive Pages deployment history
        if: ${{ needs.deploy.result == 'success' }}
        env:
          DRONEDREAM_DEPLOYMENT_ENVIRONMENT: github-pages
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/website/scripts/prune-github-pages-deployments.mjs

      - name: Retain the latest run of each workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/retain-workflow-runs.sh
