name: Deploy global product website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "desktop/src-tauri/tauri.conf.json"
      - "frontend/**"
      - "website/deployment-targets.json"
      - "website/pages-release.json"
      - "website/scripts/build-pages-site.ps1"
  workflow_dispatch:
    inputs:
      preserve_release_artifact:
        description: Preserve the commit-pinned shared artifact for a formal release anchor
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build global website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build the version-pinned Pages site
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: ./website/scripts/build-pages-site.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload commit-pinned shared website artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dronedream-site-${{ github.sha }}
          path: frontend/site-dist
          include-hidden-files: true
          if-no-files-found: error
          # Ordinary review deployments need only a short rollback window. A
          # formal release operator must opt in explicitly to long retention.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && inputs.preserve_release_artifact && 30 || 3 }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: frontend/site-dist

  deploy:
    name: Publish global website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
