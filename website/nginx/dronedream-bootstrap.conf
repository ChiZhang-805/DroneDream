server {
    listen 80;
    listen [::]:80;
    server_name dronedream.example.com;

    root /var/www/dronedream-current;
    index index.html;
    charset utf-8;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
