map $request_uri $dronedream_cache_control {
    default                                          "no-cache";
    ~^/assets/                                       "public, max-age=31536000, immutable";
    ~^/console/assets/                               "public, max-age=31536000, immutable";
    ~^/downloads/latest\.json$                      "no-store";
    ~^/downloads/.+\.(?:exe|sha256)$                "public, max-age=31536000, immutable";
}

map $request_uri $dronedream_content_disposition {
    default                                          "";
    ~^/downloads/.+\.(?:exe|sha256)$                "attachment";
}

server {
    listen 80;
    listen [::]:80;
    server_name dronedream.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/dronedream-current;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dronedream.example.com;

    ssl_certificate /etc/letsencrypt/live/dronedream.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dronedream.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DroneDreamTLS:10m;
    ssl_session_timeout 1d;

    root /var/www/dronedream-current;
    index index.html;

    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; form-action 'self'; upgrade-insecure-requests" always;
    add_header Cache-Control $dronedream_cache_control always;
    add_header Content-Disposition $dronedream_content_disposition always;

    location = /downloads/latest.json {
        try_files $uri =404;
    }

    location ~ ^/downloads/.+\.exe(?:\.sha256)?$ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /console {
        return 301 /console/;
    }

    location /console/assets/ {
        try_files $uri =404;
    }

    location /console/ {
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
