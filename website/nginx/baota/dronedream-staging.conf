map $uri $dronedream_staging_cache_control {
    default                             "no-cache";
    ~^/assets/                          "public, max-age=31536000, immutable";
    ~^/console/assets/                  "public, max-age=31536000, immutable";
    ~^/downloads/latest\.json$          "no-store";
    ~^/downloads/.+\.(?:exe|sha256)$   "no-cache";
}

map $uri $dronedream_staging_content_disposition {
    default                             "";
    ~^/downloads/.+\.(?:exe|sha256)$   "attachment";
}

server {
    listen 127.0.0.1:18080;
    server_name localhost;

    root /www/wwwroot/dronedream/candidate;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Exercise the same compression policy during candidate validation that
    # the release will use after the public symlink is switched.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /www/wwwlogs/dronedream_staging_access.log;
    error_log /www/wwwlogs/dronedream_staging_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; form-action 'self'" always;
    add_header Cache-Control $dronedream_staging_cache_control always;
    add_header Content-Disposition $dronedream_staging_content_disposition always;

    location = /downloads/latest.json {
        default_type application/json;
        try_files $uri =404;
    }

    location ~* ^/downloads/.+\.exe$ {
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ~* ^/downloads/.+\.sha256$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /console {
        return 301 /console/;
    }

    location ^~ /console/assets/ {
        try_files $uri =404;
    }

    location /console/ {
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        # Match production cache behavior during the candidate health check.
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
