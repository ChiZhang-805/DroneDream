map $request_uri $dronedream_public_cache_control {
    default                             "no-cache";
    ~^/assets/                          "public, max-age=604800, immutable";
    ~^/downloads/latest\.json$          "no-store";
    ~^/downloads/.+\.(?:exe|sha256)$   "public, max-age=3600";
}

map $request_uri $dronedream_public_content_disposition {
    default                             "";
    ~^/downloads/.+\.(?:exe|sha256)$   "attachment";
}

server {
    # The server currently has no product domain. Match only its public IPv4
    # address so BaoTa's existing WordPress default vhost keeps every other
    # hostname and can be restored simply by removing this added file.
    listen 80;
    server_name 47.93.180.216;

    root /www/wwwroot/dronedream/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /www/wwwlogs/dronedream_access.log;
    error_log /www/wwwlogs/dronedream_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'" always;
    add_header Cache-Control $dronedream_public_cache_control always;
    add_header Content-Disposition $dronedream_public_content_disposition always;

    location = /downloads/latest.json {
        default_type application/json;
        try_files $uri =404;
    }

    location ~* ^/downloads/.+\.exe$ {
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ~* ^/downloads/.+\.sha256$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        # HTML and SPA routes must be revalidated after every atomic release so
        # a cached document never points at hashed assets from an older build.
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
