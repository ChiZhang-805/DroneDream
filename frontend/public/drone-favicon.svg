<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 1 58 58">
  <defs>
    <linearGradient id="shell" x1="23" y1="20" x2="45" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#425b88" />
      <stop offset="0.28" stop-color="#1b2442" />
      <stop offset="0.72" stop-color="#0b0c19" />
      <stop offset="1" stop-color="#47124f" />
    </linearGradient>
    <linearGradient id="shellTop" x1="27" y1="19" x2="41" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7eeeff" />
      <stop offset="0.22" stop-color="#344970" />
      <stop offset="0.72" stop-color="#16182e" />
      <stop offset="1" stop-color="#dc60dc" />
    </linearGradient>
    <linearGradient id="accent" x1="17" y1="27" x2="50" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ff0ff" />
      <stop offset="0.46" stop-color="#8bbcff" />
      <stop offset="0.72" stop-color="#b994ff" />
      <stop offset="1" stop-color="#ff63cf" />
    </linearGradient>
    <linearGradient id="cyanRotor" x1="4" y1="15" x2="23" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4edcff" />
      <stop offset="1" stop-color="#9cfcff" />
    </linearGradient>
    <linearGradient id="violetRotor" x1="41" y1="17" x2="61" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9e83ff" />
      <stop offset="1" stop-color="#ff66d4" />
    </linearGradient>
    <linearGradient id="frontRotor" x1="27" y1="40" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7adfff" />
      <stop offset="0.52" stop-color="#bd8cff" />
      <stop offset="1" stop-color="#ff5fc7" />
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-100%" width="240%" height="300%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="shadow" x="-35%" y="-45%" width="170%" height="200%">
      <feDropShadow dx="0" dy="1.7" stdDeviation="1.5" flood-color="#050612" flood-opacity=".8" />
    </filter>
  </defs>

  <!-- Rotor glows remain free-standing; there is intentionally no enclosing tile. -->
  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <ellipse cx="13.5" cy="18.5" rx="10.5" ry="3.7" stroke="url(#cyanRotor)" stroke-width="2" />
    <ellipse cx="35" cy="10.5" rx="9.2" ry="3" stroke="#75eaff" stroke-width="1.8" />
    <ellipse cx="51" cy="20.5" rx="10" ry="3.7" stroke="url(#violetRotor)" stroke-width="2" />
    <ellipse cx="38" cy="44" rx="11.5" ry="4.2" stroke="url(#frontRotor)" stroke-width="2.2" />
  </g>

  <!-- Slim blades and bright hubs make the four rotors readable at favicon size. -->
  <g fill="none" stroke-linecap="round" stroke-width="1.7">
    <path d="m5.5 19.6 7.8-1 8.2 1" stroke="#c8fbff" />
    <path d="m28 10.8 6.8-.7 7 1" stroke="#d9fbff" />
    <path d="m43.5 20 7.5 1 7.6-.4" stroke="#f5d7ff" />
    <path d="m29.5 43.3 8.5 1 8.8 1" stroke="#ffe1fa" />
  </g>

  <!-- Perspective arms: rear pair sits higher and the front arm drops toward the viewer. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M27 26 15 20.5m21-1-1-6.3m7 15.5 8-6.3M35 35.5l2.5 6" stroke="#0a0d19" stroke-width="5.2" />
    <path d="M27 26 15 20.5m21-1-1-6.3" stroke="#59dff2" stroke-opacity=".52" stroke-width="1.25" />
    <path d="m42 28.7 8-6.3M35 35.5l2.5 6" stroke="#f062d1" stroke-opacity=".58" stroke-width="1.35" />
  </g>

  <!-- Motor housings. -->
  <g filter="url(#shadow)">
    <path d="m10.5 18.2 6.4.3-.8 5-4.5-.4Z" fill="#111628" stroke="#60e9ff" stroke-width="1.15" />
    <path d="m32.2 10.2 5.8.2-.7 4.6-4.3-.3Z" fill="#111628" stroke="#83ecff" stroke-width="1.1" />
    <path d="m48 20.1 6.2.5-.9 4.8-4.4-.4Z" fill="#181125" stroke="#ef66d2" stroke-width="1.15" />
    <path d="m34.2 43.2 7.5.6-1 5.2-5.3-.5Z" fill="#181125" stroke="#ff69ca" stroke-width="1.2" />
  </g>

  <!-- Rounded x500-like body with cyan-to-magenta light strip. -->
  <g filter="url(#shadow)">
    <path d="M23.2 24.2c4.8-4.3 14.2-4.8 19.7-1l2 7.8c-2.8 6.1-15.2 8.3-21.8 3.4Z" fill="url(#shell)" stroke="#d9e7ff" stroke-width="1.05" />
    <path d="M27.1 22.4c3.5-2.2 9.7-2.4 13.5-.4l-1.4 3.7-8.7.8Z" fill="url(#shellTop)" stroke="#8299c6" stroke-width=".8" />
    <path d="M24.6 27.7c5.8 3.3 14.4 3.1 19.8-.8" fill="none" stroke="url(#accent)" stroke-width="2.25" filter="url(#softGlow)" />
    <path d="m29.4 22.1 3.8-1.5 4.2 1.1-3.8 1.8Z" fill="#b9f7ff" opacity=".92" />
  </g>

  <!-- Forward camera and glowing lens. -->
  <g filter="url(#shadow)">
    <path d="m25 33.9-4.7 2.5.7 6.7 6.4.9.8-7.2Z" fill="#10223d" stroke="#63eaff" stroke-width="1.2" />
    <circle cx="23.7" cy="39.7" r="2.7" fill="#17324e" stroke="#86f4ff" stroke-width="1.5" />
    <circle cx="23.7" cy="39.7" r="1.15" fill="#efffff" filter="url(#softGlow)" />
  </g>

  <!-- Landing skids use the same luminous split as the hero model. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="m27 36.5-6.2 11.2 11.9 1" stroke="#69e8ff" stroke-width="2.15" />
    <path d="m39.4 36.3 6.4 9.4-8.2 1.4" stroke="#f36acf" stroke-width="2.15" />
  </g>
</svg>
