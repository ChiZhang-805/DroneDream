<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070913" />
    <meta name="description" content="DroneDream is an agentic PX4 and Gazebo control-parameter optimization platform for Windows." />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DroneDream" />
    <meta property="og:description" content="Configure, optimize, simulate, and compare PX4 control parameters in one local workflow." />
    <link rel="icon" type="image/png" href="/drone-favicon.png" />
    <title>DroneDream</title>
    <script>
      (() => {
        const redirectKey = "dronedream:spa-redirect";
        try {
          const redirectTarget = window.sessionStorage.getItem(redirectKey);
          window.sessionStorage.removeItem(redirectKey);
          if (
            redirectTarget &&
            redirectTarget.startsWith("/") &&
            !redirectTarget.startsWith("//")
          ) {
            window.history.replaceState(null, "", redirectTarget);
          }
        } catch {
          // The public homepage remains usable when session storage is unavailable.
        }
      })();
    </script>
  </head>
  <body>
    <div id="site-root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
