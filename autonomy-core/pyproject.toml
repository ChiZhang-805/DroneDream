[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dronedream-flight-agent-core"
version = "0.1.0"
description = "Structured, closed-loop autonomy Harness for the five DroneDream products"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "DroneDream" }]
dependencies = [
  "cryptography>=45,<51",
  "jsonschema>=4.23,<5",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
  "Pillow>=11,<13",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
desktop = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]
dev = [
  "fastapi>=0.116,<1",
  "pyinstaller>=6.15,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "python-multipart>=0.0.20,<1",
  "ruff>=0.9,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
dronedream-agent = "dronedream_agent_core.cli:main"
dronedream-plugin = "dronedream_agent_core.plugin_cli:main"
dronedream-autonomy-core = "dronedream_agent_app.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
