[package]
name = "drone-dream-desktop"
version = "0.1.0"
description = "Local-first desktop shell for DroneDream"
authors = ["DroneDream contributors"]
edition = "2021"

[lib]
name = "drone_dream_desktop_lib"
# The first desktop release targets Windows only. Mobile-oriented cdylib/staticlib
# outputs make LLVM-MinGW export every dependency symbol and can exceed PE limits.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
